# RushTI Website Build & Deployment Workflow
#
# Builds the React homepage and MkDocs documentation, and on master
# deploys them to GitHub Pages.
#
# On pull request: build only, as validation. Nothing is published.
# On push to master: build and deploy.
#
# The PR path runs the exact same build steps as the deploy path, so a
# broken site or docs change is caught in review rather than after merge,
# when it would already be live.
#
# Only triggers when website or documentation files change.

name: Website

on:
  push:
    branches: [master, main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

# Real deploys serialize on a single "pages" group and are never cancelled.
# PR validation builds get a per-PR group so they neither queue behind a
# deploy nor block one, and superseded runs are cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/homepage/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install MkDocs dependencies
        run: pip install -r docs-requirements.txt

      - name: Install homepage dependencies
        working-directory: site/homepage
        run: npm ci

      - name: Build homepage (React/Vite)
        working-directory: site/homepage
        run: npm run build

      - name: Build documentation (MkDocs)
        run: mkdocs build --site-dir mkdocs_site

      - name: Merge builds
        run: |
          mkdir -p _site
          # Copy React build to root
          cp -r site/homepage/dist/* _site/
          # Copy MkDocs to /docs subdirectory
          mkdir -p _site/docs
          cp -r mkdocs_site/* _site/docs/

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
